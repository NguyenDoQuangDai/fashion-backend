spring.application.name=fashion-backend

# Load local env file if present
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/5sman_db
spring.datasource.username=postgres
spring.datasource.password=123456789
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Gmail SMTP (đã lưu trong .env)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT settings (đã lưu trong .env)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=600
app.jwt.refresh-days=7

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Admin seed (đã lưu trong .env)
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Gemini (đã lưu trong .env)
app.gemini.api-key=${APP_GEMINI_API_KEY}
app.gemini.model=${APP_GEMINI_MODEL:gemini-3.5-flash}

# App URLs (đã lưu trong .env nếu cần)
app.backend-base-url=${BACKEND_BASE_URL:http://localhost:8080}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
